const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function getWeekStart(d) {
  const date = d ? new Date(d) : new Date(); const day = date.getDay();
  // Saturday = 6, so offset to get to the previous (or current) Saturday
  const diff = (day + 1) % 7; // Sat=0, Sun=1, Mon=2, ...
  date.setDate(date.getDate() - diff); date.setHours(0,0,0,0); return date;
}
const fmtDate = d => d.toISOString().split('T')[0];
const localDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseDate = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addWeeks = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n*7); return r; };
const daysBetween = (a,b) => Math.round((b-a)/86400000);
const daysAgo = s => daysBetween(parseDate(s), new Date());
function fmtWeek(start) {
  const end=new Date(start); end.setDate(end.getDate()+6);
  return `${start.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`;
}
const isThisWeek = start => fmtDate(start)===fmtDate(getWeekStart());
function relDate(s) { const d=daysAgo(s); if(d===0) return 'Today'; if(d===1) return 'Yesterday'; if(d<7) return d+' days ago'; if(d<14) return 'Last week'; return Math.round(d/7)+' weeks ago'; }
function calcRestock(purchases) {
  if(!purchases||purchases.length<2) return null;
  const sorted=[...purchases].sort(); let total=0;
  for(let i=1;i<sorted.length;i++) total+=daysBetween(parseDate(sorted[i-1]),parseDate(sorted[i]));
  const avg=Math.round(total/(sorted.length-1)); const since=daysAgo(sorted[sorted.length-1]);
  return { avgDays:avg, daysSince:since, overdue:since-avg, isOverdue:since>avg };
}

function guessCategory(name) {
  const lower = name.toLowerCase();
  for (const [cat, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
    if (keywords.some(kw => lower.includes(kw))) return cat;
  }
  return 'Other';
}

function parseReceipt(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const items = [];
  const priceRe = /£-?\d+\.\d{2}/;

  // Skip patterns
  const skipRe = /^(subtotal|total|delivery|saving|clubcard|nectar|item[s]?\b|product[s]?\b|qty\b|quantity|price|description|your order|order summary|substitut|payment|paid|card ending|visa|mastercard|amex|slot|basket|multibuy|offer|discount|refund|carrier bag|bag charge|minimum|estimated|original|price match|you saved|reward|point|receipt|order ref|order number|invoice|vat|thank you|great choice|next delivery|helpful|rate your|how was|customer ref|driver|packed by|this order|standard delivery|free delivery|pick.?up|collect|click.?collect)/i;
  const dateRe = /^\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}/;
  const sepRe = /^[=\-_*~·•—–]+$/;

  for (const line of lines) {
    if (skipRe.test(line)) continue;
    if (dateRe.test(line)) continue;
    if (sepRe.test(line)) continue;
    if (line.length < 3) continue;

    // Must have a price to be a credible item line
    if (!priceRe.test(line)) continue;

    let name = line;
    // Strip all prices
    name = name.replace(/£-?\d+\.\d{2}/g, '');
    // Strip quantity patterns
    name = name.replace(/\b(?:qty|quantity)\s*:?\s*\d+/gi, '');
    name = name.replace(/\s+x\s*\d+\s*$/i, '');
    name = name.replace(/^\d+\s*x\s+/i, '');
    // Strip store brand prefixes
    name = name.replace(/^(?:Sainsbury'?s?|by Sainsbury'?s?|Taste the Difference|TTD|SO Organic|Stamford Street Co\.?|Hubbard'?s?|Ocado|Ocado Life|Ocado Own|Go Cook|Good Natured)\s+/i, '');
    // Strip leading/trailing punctuation and whitespace
    name = name.replace(/^[,.\-–—:;|]+|[,.\-–—:;|]+$/g, '').trim();
    // Collapse multiple spaces
    name = name.replace(/\s{2,}/g, ' ');

    if (name.length >= 2 && !/^\d+$/.test(name)) {
      items.push({ name, category: guessCategory(name), selected: true });
    }
  }

  // Deduplicate by name (case-insensitive)
  const seen = new Set();
  return items.filter(i => {
    const key = i.name.toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function useMediaQuery(query) {
  const [matches, setMatches] = useState(() => { try { return window.matchMedia(query).matches; } catch(e) { return false; } });
  useEffect(() => {
    try {
      const mq = window.matchMedia(query);
      const handler = e => setMatches(e.matches);
      mq.addEventListener('change', handler);
      return () => mq.removeEventListener('change', handler);
    } catch(e) {}
  }, [query]);
  return matches;
}

// ======================== SYNC ENGINE ========================
// Both of you edit the same data from different phones. Each device keeps:
//   - its local data (what you see),
//   - a "base" copy: the last version it agreed on with the server,
//   - the server's version token (updated_at) for that base.
// When saving, local changes (local vs base) are merged item-by-item with the other
// person's changes (server vs base), and the write only succeeds if nobody else saved
// in between; otherwise it re-reads and merges again. So neither person's edits get lost.
const LS_PREFIX = 'kitchen_';
const DATA_KEYS = ['recipes','inventory','mealplans','shopping'];
const DEFAULTS = { recipes:[], inventory:[], mealplans:{}, shopping:[] };
const COLUMNS = DATA_KEYS.map(k => 'kitchen_'+k);

const isPlainObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const isPrim = v => v === null || typeof v !== 'object';
function deepEq(a, b) {
  if (a === b) return true;
  if (Array.isArray(a)) {
    if (!Array.isArray(b) || a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (!deepEq(a[i], b[i])) return false;
    return true;
  }
  if (isPlainObj(a) && isPlainObj(b)) {
    const ka = Object.keys(a).filter(k => a[k] !== undefined), kb = Object.keys(b).filter(k => b[k] !== undefined);
    if (ka.length !== kb.length) return false;
    return ka.every(k => deepEq(a[k], b[k]));
  }
  return false;
}
const isIdList = a => a.every(x => isPlainObj(x) && x.id != null);

function mergeById(b, l, r) {
  const bm = new Map(b.map(x => [x.id, x])), rm = new Map(r.map(x => [x.id, x])), lm = new Map(l.map(x => [x.id, x]));
  const out = [];
  for (const x of l) {
    if (rm.has(x.id)) out.push(merge3(bm.get(x.id), x, rm.get(x.id)));
    else if (bm.has(x.id) && deepEq(bm.get(x.id), x)) continue; // deleted on the other device, untouched here
    else out.push(x); // added here, or edited here (an edit beats a delete)
  }
  for (const y of r) {
    if (lm.has(y.id)) continue;
    if (bm.has(y.id) && deepEq(bm.get(y.id), y)) continue; // deleted here, untouched there
    out.push(y);
  }
  return out;
}

function mergeMultiset(b, l, r) {
  const count = a => { const m = new Map(); a.forEach(v => m.set(v, (m.get(v)||0)+1)); return m; };
  const cb = count(b), cl = count(l), cr = count(r);
  const target = new Map();
  new Set([...cl.keys(), ...cr.keys()]).forEach(v => target.set(v, Math.max(0, (cl.get(v)||0) + (cr.get(v)||0) - (cb.get(v)||0))));
  const out = [], used = new Map();
  for (const v of [...l, ...r]) {
    const u = used.get(v)||0;
    if (u < (target.get(v)||0)) { out.push(v); used.set(v, u+1); }
  }
  return out;
}

function merge3(b, l, r) {
  if (deepEq(l, r)) return l;
  if (deepEq(b, l)) return r;
  if (deepEq(b, r)) return l;
  if (Array.isArray(l) && Array.isArray(r)) {
    const bb = Array.isArray(b) ? b : [];
    if (isIdList(l) && isIdList(r) && isIdList(bb)) return mergeById(bb, l, r);
    if (l.every(isPrim) && r.every(isPrim) && bb.every(isPrim)) return mergeMultiset(bb, l, r);
    return l;
  }
  if (isPlainObj(l) && isPlainObj(r)) {
    const bb = isPlainObj(b) ? b : {};
    const out = {};
    for (const k of new Set([...Object.keys(l), ...Object.keys(r)])) {
      const inB = bb[k] !== undefined, inL = l[k] !== undefined, inR = r[k] !== undefined;
      if (inL && inR) out[k] = merge3(bb[k], l[k], r[k]);
      else if (inL) { if (!(inB && deepEq(bb[k], l[k]))) out[k] = l[k]; }
      else if (inR) { if (!(inB && deepEq(bb[k], r[k]))) out[k] = r[k]; }
    }
    return out;
  }
  return l; // same value changed on both devices: this device wins
}

const pickData = d => { const o = {}; DATA_KEYS.forEach(k => o[k] = d?.[k] ?? DEFAULTS[k]); return o; };
function mergeData(base, local, remote) {
  const o = {};
  DATA_KEYS.forEach(k => o[k] = merge3(base ? base[k] : undefined, local[k], remote[k]));
  return o;
}
const rowToData = row => { const o = {}; DATA_KEYS.forEach(k => o[k] = row['kitchen_'+k] ?? DEFAULTS[k]); return o; };

function lsGet(k) { try { return localStorage.getItem(LS_PREFIX+k); } catch(e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(LS_PREFIX+k); else localStorage.setItem(LS_PREFIX+k, v); } catch(e) {} }

function loadLocal() {
  const d = {};
  try { DATA_KEYS.forEach(k => { const v = lsGet(k); d[k] = v ? JSON.parse(v) : DEFAULTS[k]; }); }
  catch(e) { Object.assign(d, DEFAULTS); }
  return d;
}
function saveLocal(d) { DATA_KEYS.forEach(k => lsSet(k, JSON.stringify(d[k]))); }
function loadBase() { try { const v = lsGet('base'); return v ? JSON.parse(v) : null; } catch(e) { return null; } }

function useKitchenData(userId) {
  const [data, setData] = useState(loadLocal);
  const [sync, setSync] = useState('offline');
  const dataRef = useRef(data);
  const dirtyRef = useRef(lsGet('dirty') === 'true');
  const baseRef = useRef(loadBase());
  const versionRef = useRef(lsGet('version'));
  const busyRef = useRef(false), againRef = useRef(false), timerRef = useRef(null);

  function setLocal(nd, dirty) {
    dataRef.current = nd; setData(nd); saveLocal(nd);
    dirtyRef.current = dirty; lsSet('dirty', dirty ? 'true' : null);
  }
  function setBase(base, version) {
    baseRef.current = base; versionRef.current = version;
    lsSet('base', JSON.stringify(base)); lsSet('version', version);
  }

  async function fetchRemote() {
    const { data:row, error } = await sb.from('user_data').select(COLUMNS.join(',')+',updated_at').eq('user_id', userId).maybeSingle();
    if (error) throw error;
    return row ? { data: rowToData(row), version: row.updated_at } : null;
  }

  async function syncOnce() {
    let remote = await fetchRemote();
    if (!dirtyRef.current) {
      if (remote && remote.version !== versionRef.current) {
        setBase(remote.data, remote.version);
        setLocal(remote.data, false);
      }
      return;
    }
    for (let attempt = 0; attempt < 5; attempt++) {
      const snapshot = dataRef.current;
      const local = pickData(snapshot);
      const merged = remote ? mergeData(baseRef.current, local, remote.data) : local;
      const payload = { updated_at: new Date().toISOString() };
      DATA_KEYS.forEach(k => payload['kitchen_'+k] = merged[k]);
      let res;
      if (!remote) {
        res = await sb.from('user_data').insert({ user_id: userId, ...payload }).select('updated_at');
      } else {
        let q = sb.from('user_data').update(payload).eq('user_id', userId);
        q = remote.version == null ? q.is('updated_at', null) : q.eq('updated_at', remote.version);
        res = await q.select('updated_at');
      }
      const ok = !res.error && res.data && res.data.length > 0;
      if (res.error && res.error.code !== '23505') throw res.error;
      if (!ok) { remote = await fetchRemote(); continue; } // someone else saved first: merge again
      setBase(merged, res.data[0].updated_at);
      const current = dataRef.current;
      if (current === snapshot) setLocal(merged, false);
      else setLocal(mergeData(local, pickData(current), merged), true); // edits made while saving
      return;
    }
    throw new Error('Too many conflicting saves');
  }

  async function syncNow() {
    if (!userId) return;
    if (busyRef.current) { againRef.current = true; return; }
    busyRef.current = true; setSync('syncing');
    try {
      do { againRef.current = false; await syncOnce(); } while (againRef.current || dirtyRef.current);
      setSync('synced');
    } catch(e) { setSync('offline'); }
    finally { busyRef.current = false; }
  }

  function schedulePush() { clearTimeout(timerRef.current); timerRef.current = setTimeout(syncNow, 800); }

  function update(key, updater) {
    const prev = dataRef.current;
    const val = typeof updater === 'function' ? updater(prev[key]) : updater;
    const nd = { ...prev, [key]: val };
    setLocal(nd, true);
    schedulePush();
  }

  useEffect(() => {
    syncNow();
    const onOnline = () => syncNow();
    const onVis = () => { if (document.visibilityState === 'visible') syncNow(); else if (dirtyRef.current) { clearTimeout(timerRef.current); syncNow(); } };
    window.addEventListener('online', onOnline);
    document.addEventListener('visibilitychange', onVis);
    // Live updates when the other person saves (needs Realtime enabled for user_data in Supabase);
    // the poll below is the fallback.
    let channel = null;
    try {
      channel = sb.channel('kitchen-'+userId)
        .on('postgres_changes', { event:'*', schema:'public', table:'user_data', filter:`user_id=eq.${userId}` },
          payload => { if (payload?.new?.updated_at !== versionRef.current) syncNow(); })
        .subscribe();
    } catch(e) {}
    const interval = setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 15000);
    return () => {
      window.removeEventListener('online', onOnline);
      document.removeEventListener('visibilitychange', onVis);
      clearInterval(interval); clearTimeout(timerRef.current);
      try { if (channel) sb.removeChannel(channel); } catch(e) {}
    };
  }, [userId]);

  return { data, update, sync };
}

function AuthScreen({onLogin}) {
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [mode, setMode] = useState('login');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  async function handleSubmit(e) {
    e.preventDefault(); setError(''); setLoading(true);
    try {
      const fn = mode==='login' ? sb.auth.signInWithPassword({email,password:pass}) : sb.auth.signUp({email,password:pass});
      const {data,error:err} = await fn;
      if(err) { setError(err.message); setLoading(false); return; }
      if(data?.session) onLogin(data.session);
      else if(mode==='signup') setError('Check your email to confirm your account.');
      setLoading(false);
    } catch(e) { setError('Connection failed'); setLoading(false); }
  }

  return (
    <div style={S.authContainer}>
      <div style={{textAlign:'center',marginBottom:32}}>
        <div style={{fontSize:'3rem',marginBottom:8}}>🍳</div>
        <h1 style={{fontSize:'1.8rem',letterSpacing:'-.02em',marginBottom:4}}>Our Kitchen</h1>
        <p style={{color:'var(--text-muted)',fontSize:'.9rem'}}>Meal planning for two</p>
      </div>
      <form onSubmit={handleSubmit} style={{width:'100%',maxWidth:340}}>
        <div style={S.field}><input type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} required /></div>
        <div style={S.field}><input type="password" placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} required minLength={6} /></div>
        {error && <div style={{background:'var(--danger-bg)',color:'var(--danger)',borderRadius:10,padding:'10px 14px',fontSize:'.85rem',marginBottom:14}}>{error}</div>}
        <Btn primary style={{width:'100%',marginBottom:12}} disabled={loading}>{loading ? 'Please wait…' : mode==='login' ? 'Log In' : 'Sign Up'}</Btn>
        <p style={{textAlign:'center',fontSize:'.85rem',color:'var(--text-muted)'}}>
          {mode==='login' ? "Don't have an account? " : 'Already have an account? '}
          <span style={{color:'var(--accent)',cursor:'pointer',fontWeight:600}} onClick={()=>{setMode(mode==='login'?'signup':'login');setError('')}}>
            {mode==='login' ? 'Sign Up' : 'Log In'}
          </span>
        </p>
      </form>
      <p style={{marginTop:40,fontSize:'.7rem',color:'var(--text-muted)'}}>v{APP_VERSION}</p>
    </div>
  );
}

// ======================== SUGGESTIONS ========================
const cellRecipeId = v => typeof v === 'string' && v !== '__OUT__' ? v : null;
const cellLeftover = v => (v && typeof v === 'object' && v.leftover) ? v.leftover : null;
const dayDate = (weekKey, day) => { const d = parseDate(weekKey); d.setDate(d.getDate() + DAYS.indexOf(day)); return d; };

// Every time each recipe has been on the plan: { recipeId: [{wk, day, meal, date}] }
function planHistory(mealplans) {
  const h = {};
  for (const [wk, p] of Object.entries(mealplans || {})) {
    for (const [key, v] of Object.entries(p?.cells || {})) {
      const id = cellRecipeId(v); if (!id) continue;
      const [day, meal] = key.split('-');
      if (!DAYS.includes(day)) continue;
      (h[id] = h[id] || []).push({ wk, day, meal, date: dayDate(wk, day) });
    }
  }
  return h;
}

// Rank recipes for one slot: favour ones you haven't had for a while, rate highly, usually
// have at this meal, and that differ from the meals either side. Returns [{recipe, score, why}].
function suggestFor({ recipes, history, weekKey, day, meal, cells, exclude = [], jitter = 0 }) {
  const target = dayDate(weekKey, day), di = DAYS.indexOf(day), thisKey = `${day}-${meal}`;
  const byId = {}; recipes.forEach(r => byId[r.id] = r);
  const inWeek = new Set(Object.entries(cells).filter(([k]) => k !== thisKey).map(([, v]) => cellRecipeId(v)).filter(Boolean));
  const nearCats = [];
  [DAYS[di-1], day, DAYS[di+1]].forEach(d => d && MEALS.forEach(m => {
    if (`${d}-${m}` === thisKey) return;
    const r = byId[cellRecipeId(cells[`${d}-${m}`])]; if (r && r.category && r.category !== 'Other') nearCats.push(r.category);
  }));
  return recipes.filter(r => !exclude.includes(r.id) && !inWeek.has(r.id)).map(r => {
    const occ = (history[r.id] || []).filter(o => !(o.wk === weekKey && o.day === day && o.meal === meal));
    const dates = occ.map(o => o.date);
    if (r.lastCooked) dates.push(parseDate(r.lastCooked));
    let gap = Infinity;
    dates.forEach(d => { gap = Math.min(gap, Math.abs(daysBetween(d, target))); });
    const rating = r.rating || 0, atMeal = occ.filter(o => o.meal === meal).length, atOther = occ.length - atMeal;
    let score = 0; const why = [];
    if (gap === Infinity) { score += 30; why.push('Not had yet'); }
    else {
      score += Math.min(gap, 60) / 60 * 40;
      if (gap >= 14) why.push(`Not had for ${gap >= 60 ? Math.round(gap/30.4) + ' months' : Math.round(gap/7) + ' weeks'}`);
      else if (gap < 7) why.push('Had recently');
    }
    if (rating) { score += (rating - 3) * 12; if (rating >= 4) why.unshift('★'.repeat(rating)); }
    if (atMeal) score += 8; else if (atOther >= 2) score -= 10;
    if (occ.length >= 4) why.push('A regular');
    score += Math.min(occ.length, 8);
    score -= nearCats.filter(c => c === r.category).length * 6;
    score += Math.random() * jitter;
    return { recipe: r, score, why: why.slice(0, 2).join(' · ') };
  }).sort((a, b) => b.score - a.score);
}
function weightedPick(list) {
  if (!list.length) return null;
  const max = list[0].score, w = list.map(s => Math.exp((s.score - max) / 10)), total = w.reduce((a, b) => a + b, 0);
  let x = Math.random() * total;
  for (let i = 0; i < list.length; i++) { x -= w[i]; if (x <= 0) return list[i]; }
  return list[list.length - 1];
}

// ======================== SHOPPING FROM PLAN ========================
const UNITS = { g:'g', gram:'g', grams:'g', gr:'g', kg:['g',1000], kilo:['g',1000], kilos:['g',1000], ml:'ml', l:['ml',1000], litre:['ml',1000], litres:['ml',1000], liter:['ml',1000], liters:['ml',1000],
  tsp:'tsp', teaspoon:'tsp', teaspoons:'tsp', tbsp:'tbsp', tbs:'tbsp', tablespoon:'tbsp', tablespoons:'tbsp' };
const PLURAL_UNITS = { tin:'tins', can:'cans', cup:'cups', clove:'cloves', pack:'packs', packet:'packets', bunch:'bunches', handful:'handfuls', slice:'slices', jar:'jars', bag:'bags', pinch:'pinches', sprig:'sprigs', stick:'sticks', head:'heads', fillet:'fillets', rasher:'rashers' };
const FRACTIONS = { '½':.5, '¼':.25, '¾':.75, '⅓':1/3, '⅔':2/3 };
const STAPLES = new Set(['salt','pepper','black pepper','salt and pepper','water','olive oil','vegetable oil','sunflower oil','oil','cooking oil']);

function singular(w) {
  if (/ies$/.test(w)) return w.slice(0,-3) + 'y';
  if (/oes$/.test(w)) return w.slice(0,-2);
  if (/(ch|sh|x|ss)es$/.test(w)) return w.slice(0,-2);
  if (/s$/.test(w) && !/ss$/.test(w)) return w.slice(0,-1);
  return w;
}
// "Onions, finely chopped" and "onion" are the same thing to buy
function ingKey(name) {
  const base = (name || '').toLowerCase().split(',')[0].replace(/\(.*?\)/g, '').replace(/\s+/g, ' ').trim();
  const words = base.split(' '); words[words.length-1] = singular(words[words.length-1]);
  return words.join(' ');
}
function parseQty(q) {
  const s = (q || '').trim().toLowerCase();
  const m = s.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+\s*[½¼¾⅓⅔]?|[½¼¾⅓⅔])\s*([a-z]+)?\.?$/);
  if (!m) return null;
  let n, v = m[1].trim();
  if (/^\d+\s+\d+\/\d+$/.test(v)) { const [w, f] = v.split(/\s+/); const [a, b] = f.split('/'); n = +w + a/b; }
  else if (/^\d+\/\d+$/.test(v)) { const [a, b] = v.split('/'); n = a/b; }
  else { const fr = v.slice(-1); n = FRACTIONS[fr] != null ? (parseFloat(v.slice(0,-1)) || 0) + FRACTIONS[fr] : parseFloat(v); }
  if (!isFinite(n)) return null;
  let unit = m[2] || '';
  const u = UNITS[unit];
  if (Array.isArray(u)) { unit = u[0]; n *= u[1]; } else if (u) unit = u;
  else if (unit) { const sing = Object.keys(PLURAL_UNITS).find(k => PLURAL_UNITS[k] === unit); unit = sing || unit; }
  return { n, unit };
}
function fmtQty(n, unit) {
  const num = x => String(Math.round(x * 100) / 100);
  if (unit === 'g') return n >= 1000 ? num(n/1000) + 'kg' : num(n) + 'g';
  if (unit === 'ml') return n >= 1000 ? num(n/1000) + 'l' : num(n) + 'ml';
  if (!unit) return num(n);
  return num(n) + ' ' + (n > 1 && PLURAL_UNITS[unit] ? PLURAL_UNITS[unit] : unit);
}
// Add up quantities that share a unit: ["300g","200g","1 tin"] -> "500g + 1 tin"
function combineQty(qtys) {
  const sums = {}, order = [], raw = [];
  qtys.filter(q => q && q.trim()).forEach(q => {
    const p = parseQty(q);
    if (!p) { if (!raw.includes(q.trim())) raw.push(q.trim()); return; }
    if (!(p.unit in sums)) { sums[p.unit] = 0; order.push(p.unit); }
    sums[p.unit] += p.n;
  });
  return [...order.map(u => fmtQty(sums[u], u)), ...raw].join(' + ');
}
// Meals in a week that need shopping for. Meal prep counts once, however many lunches it covers.
function weekMeals(plan, recipeMap) {
  const cells = plan?.cells || {}, mp = plan?.mealPrep, out = [];
  let prepAdded = false;
  DAYS.forEach((day, di) => MEALS.forEach(meal => {
    const id = cellRecipeId(cells[`${day}-${meal}`]); if (!id || !recipeMap[id]) return;
    if (mp && meal === 'Lunch' && id === mp.recipeId && (mp.days || []).includes(day)) {
      if (!prepAdded) { prepAdded = true; out.push({ key: 'mealprep', recipe: recipeMap[id], label: 'Meal prep', di: Math.min(...mp.days.map(d => DAYS.indexOf(d))) }); }
      return;
    }
    out.push({ key: `${day}-${meal}`, recipe: recipeMap[id], label: `${day} ${meal.toLowerCase()}`, di });
  }));
  return out;
}
function combineIngredients(meals) {
  const map = new Map();
  meals.forEach(m => (m.recipe.ingredients || []).forEach(ing => {
    if (!ing.name || !ing.name.trim()) return;
    const k = ingKey(ing.name);
    if (!map.has(k)) map.set(k, { key: k, name: ing.name.split(',')[0].replace(/\(.*?\)/g,'').trim(), qtys: [], from: [] });
    const e = map.get(k); e.qtys.push(ing.qty); if (!e.from.includes(m.recipe.name)) e.from.push(m.recipe.name);
  }));
  return [...map.values()].map(e => ({ ...e, qty: combineQty(e.qtys) }));
}

function ShopFromPlan({ plan, recipeMap, inventory, shopping, todayIdx, onAdd, onClose }) {
  const meals = useMemo(() => weekMeals(plan, recipeMap), [plan, recipeMap]);
  const [mealOn, setMealOn] = useState(() => { const o = {}; meals.forEach(m => o[m.key] = m.di >= todayIdx); return o; });
  const [over, setOver] = useState({});
  const items = useMemo(() => combineIngredients(meals.filter(m => mealOn[m.key])), [meals, mealOn]);
  const onList = useMemo(() => new Set(shopping.filter(i => !i.checked).map(i => ingKey(i.name))), [shopping]);
  const pantry = useMemo(() => { const m = new Map(); inventory.forEach(i => m.set(ingKey(i.name), i)); return m; }, [inventory]);
  function reason(it) {
    if (onList.has(it.key)) return 'Already on your list';
    const inv = pantry.get(it.key);
    if (inv?.purchases?.length) {
      const last = [...inv.purchases].sort().pop(), ago = daysAgo(last), r = calcRestock(inv.purchases);
      if (r ? !r.isOverdue : ago <= 7) return `Bought ${relDate(last).toLowerCase()}`;
    }
    if (STAPLES.has(it.key)) return 'Cupboard staple';
    return null;
  }
  const rows = items.map(it => { const why = reason(it); return { ...it, why, on: over[it.key] ?? !why }; });
  const chosen = rows.filter(r => r.on);
  const sectionHead = { fontSize:'.72rem', fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em', color:'var(--text-muted)', margin:'4px 0 6px' };
  if (!meals.length) return <p style={{color:'var(--text-muted)'}}>No recipes planned this week yet.</p>;
  return (<div>
    <div style={sectionHead}>Meals</div>
    {meals.map(m => (
      <div key={m.key} style={{...S.checkRow,cursor:'pointer'}} onClick={() => setMealOn(o => ({...o, [m.key]: !o[m.key]}))}>
        <span style={{...S.checkbox, ...(mealOn[m.key] && S.checkboxOn)}}>{mealOn[m.key] && Icon.check}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={S.itemName}>{m.recipe.name}</div>
          <div style={S.itemMeta}>{m.label}{!(m.recipe.ingredients||[]).length && ' · no ingredients listed'}</div>
        </div>
      </div>
    ))}
    <div style={{...sectionHead, marginTop:18}}>Ingredients</div>
    {rows.length === 0 && <p style={{color:'var(--text-muted)',fontSize:'.85rem'}}>Nothing to buy for the selected meals.</p>}
    {rows.map(r => (
      <div key={r.key} style={{...S.checkRow,cursor:'pointer'}} onClick={() => setOver(o => ({...o, [r.key]: !r.on}))}>
        <span style={{...S.checkbox, ...(r.on && S.checkboxOn)}}>{r.on && Icon.check}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{...S.itemName, ...(!r.on && {color:'var(--text-muted)'})}}>{r.name}</div>
          <div style={S.itemMeta}>{r.why ? <span style={{color:'var(--warning)'}}>{r.why} · </span> : null}{r.from.join(', ')}</div>
        </div>
        <span style={{color:'var(--text-muted)',fontSize:'.82rem',fontVariantNumeric:'tabular-nums',flexShrink:0,maxWidth:'40%',textAlign:'right'}}>{r.qty}</span>
      </div>
    ))}
    <div style={{position:'sticky',bottom:-20,background:'var(--surface)',padding:'14px 0 4px',marginTop:8}}>
      <Btn primary style={{width:'100%'}} disabled={!chosen.length} onClick={() => onAdd(chosen.map(r => ({
        id: genId(), name: r.name, qty: r.qty, category: pantry.get(r.key)?.category || guessCategory(r.name),
        checked: false, fromRecipe: r.from.join(', '), addedAt: new Date().toISOString() })))}>
        Add {chosen.length} item{chosen.length !== 1 ? 's' : ''} to list
      </Btn>
    </div>
  </div>);
}

// ======================== PLAN TAB ========================
function PlanTab({data, update, isDesktop, cook}) {
  const {recipes, mealplans} = data;
  const [weekOffset, setWeekOffset] = useState(0);
  const [showShop, setShowShop] = useState(false);
  const [flash, setFlash] = useState(null);
  const [picker, setPicker] = useState(null);
  const [search, setSearch] = useState('');
  const [mealPrepOverlay, setMealPrepOverlay] = useState(null); // null | 'pick' | 'days'
  const [mealPrepRecipe, setMealPrepRecipe] = useState(null);
  const [mealPrepDays, setMealPrepDays] = useState({});
  const [mealPrepSearch, setMealPrepSearch] = useState('');
  const [showHistory, setShowHistory] = useState(false);
  const [surprise, setSurprise] = useState(null); // {id, why, seen:[]}
  const [undo, setUndo] = useState(null); // {weekKey, filled:{key:id}, prevPlanned:{id:lastPlanned}}

  const weekStart = useMemo(() => addWeeks(getWeekStart(), weekOffset), [weekOffset]);
  const weekKey = fmtDate(weekStart);
  const plan = mealplans[weekKey] || {};
  const cells = plan.cells || {};
  const mealPrep = plan.mealPrep || null; // {recipeId, days: ['Mon','Wed','Fri']}
  const recipeMap = useMemo(() => { const m={}; recipes.forEach(r=>m[r.id]=r); return m; }, [recipes]);
  const history = useMemo(() => planHistory(mealplans), [mealplans]);
  useEffect(() => { setUndo(null); }, [weekOffset]);
  useEffect(() => { if (!undo) return; const t = setTimeout(() => setUndo(null), 15000); return () => clearTimeout(t); }, [undo]);

  // Change this week's cells from the latest data (not this render's copy), so edits
  // arriving from the other phone at the same moment aren't overwritten.
  function setWeek(fn) {
    update('mealplans', mp => { const p = mp[weekKey] || {}; return { ...mp, [weekKey]: { ...fn(p), updatedAt: new Date().toISOString() } }; });
  }
  const setCells = fn => setWeek(p => ({ ...p, cells: fn(p.cells || {}) }));
  const markPlanned = ids => update('recipes', rs => rs.map(r => ids.includes(r.id) ? { ...r, lastPlanned: weekKey } : r));

  // Get meal prep history (last 12 weeks, excluding current)
  const mealPrepHistory = useMemo(() => {
    const history = [];
    for (let i = 1; i <= 16; i++) {
      const wk = fmtDate(addWeeks(getWeekStart(), weekOffset - i));
      const p = mealplans[wk];
      if (p?.mealPrep?.recipeId) {
        const r = recipeMap[p.mealPrep.recipeId];
        if (r) history.push({ weekKey: wk, recipeId: p.mealPrep.recipeId, recipeName: r.name, days: p.mealPrep.days, category: r.category });
      }
      if (history.length >= 12) break;
    }
    return history;
  }, [mealplans, weekOffset, recipeMap]);

  // Recent meal prep recipe IDs (deduplicated, for showing in lunch picker)
  const recentMealPrepRecipes = useMemo(() => {
    const seen = new Set();
    return mealPrepHistory.filter(h => { if (seen.has(h.recipeId)) return false; seen.add(h.recipeId); return true; }).slice(0, 5);
  }, [mealPrepHistory]);

  function assign(val) {
    if(!picker) return;
    const key = `${picker.day}-${picker.meal}`;
    setCells(c => { const n = {...c}; if(val) n[key] = val; else delete n[key]; return n; });
    if(cellRecipeId(val)) markPlanned([val]);
    setPicker(null); setSearch(''); setSurprise(null);
  }

  function openPicker(day, meal) {
    setPicker({day, meal}); setSurprise(null);
    setSearch(cellNote(cells[`${day}-${meal}`]) || '');
  }

  function addNote() {
    const text = search.trim();
    if (text) assign({note: text});
  }

  function openMealPrep() {
    setMealPrepOverlay('pick');
    setMealPrepRecipe(null);
    setMealPrepDays({});
    setMealPrepSearch('');
  }

  function pickMealPrepRecipe(recipeId) {
    setMealPrepRecipe(recipeId);
    setMealPrepOverlay('days');
    setMealPrepDays({});
  }

  function toggleMealPrepDay(day) {
    setMealPrepDays(prev => ({...prev, [day]: !prev[day]}));
  }

  function confirmMealPrep() {
    if (!mealPrepRecipe) return;
    const selectedDays = DAYS.filter(d => mealPrepDays[d]);
    if (selectedDays.length === 0) return;
    setWeek(p => {
      const n = {...(p.cells||{})};
      selectedDays.forEach(day => { n[`${day}-Lunch`] = mealPrepRecipe; });
      return {...p, cells: n, mealPrep: { recipeId: mealPrepRecipe, days: selectedDays }};
    });
    markPlanned([mealPrepRecipe]);
    setMealPrepOverlay(null); setMealPrepRecipe(null); setMealPrepDays({});
  }

  function reuseMealPrep(h) {
    setMealPrepRecipe(h.recipeId);
    const dayMap = {};
    h.days.forEach(d => dayMap[d] = true);
    setMealPrepDays(dayMap);
    setMealPrepOverlay('days');
  }

  function clearMealPrep() {
    if (!mealPrep) return;
    setWeek(p => {
      const n = {...(p.cells||{})};
      (mealPrep.days||[]).forEach(day => { if(n[`${day}-Lunch`] === mealPrep.recipeId) delete n[`${day}-Lunch`]; });
      const np = {...p, cells: n}; delete np.mealPrep; return np;
    });
  }

  // ---- Help choosing
  const todayIdx = weekOffset === 0 ? (new Date().getDay() + 1) % 7 : weekOffset < 0 ? 7 : 0;
  const emptyDinners = DAYS.filter((d, i) => i >= todayIdx && !cells[`${d}-Dinner`]);
  function fillDinners() {
    const working = {...cells}, filled = {}, picked = [];
    emptyDinners.forEach(day => {
      const [top] = suggestFor({ recipes, history, weekKey, day, meal:'Dinner', cells: working, exclude: picked, jitter: 10 });
      if (!top) return;
      working[`${day}-Dinner`] = filled[`${day}-Dinner`] = top.recipe.id; picked.push(top.recipe.id);
    });
    if (!picked.length) return;
    const prevPlanned = {}; picked.forEach(id => prevPlanned[id] = recipeMap[id]?.lastPlanned || null);
    setCells(c => { const n = {...c}; Object.entries(filled).forEach(([k, id]) => { if (!n[k]) n[k] = id; }); return n; });
    markPlanned(picked);
    setUndo({ weekKey, filled, prevPlanned });
  }
  function undoFill() {
    if (!undo || undo.weekKey !== weekKey) return;
    setCells(c => { const n = {...c}; Object.entries(undo.filled).forEach(([k, id]) => { if (n[k] === id) delete n[k]; }); return n; });
    update('recipes', rs => rs.map(r => { if (!(r.id in undo.prevPlanned)) return r; const n = {...r}; if (undo.prevPlanned[r.id]) n.lastPlanned = undo.prevPlanned[r.id]; else delete n.lastPlanned; return n; }));
    setUndo(null);
  }
  function surpriseMe(list) {
    const top = list.slice(0, 10), seen = surprise?.seen || [];
    let pool = top.filter(s => !seen.includes(s.recipe.id) && s.recipe.id !== surprise?.id);
    if (!pool.length) pool = top.filter(s => s.recipe.id !== surprise?.id);
    const p = weightedPick(pool);
    if (p) setSurprise({ id: p.recipe.id, why: p.why, seen: pool.length > 1 ? [...seen, p.recipe.id] : [p.recipe.id] });
  }
  // Yesterday's dinner, offered as leftovers for lunch
  function prevDinner(day) {
    const i = DAYS.indexOf(day);
    const v = i > 0 ? cells[`${DAYS[i-1]}-Dinner`] : mealplans[fmtDate(addWeeks(weekStart, -1))]?.cells?.['Fri-Dinner'];
    const id = cellRecipeId(v);
    if (id && recipeMap[id]) return { label: recipeMap[id].name, value: { leftover: id } };
    const note = cellNote(v);
    if (note && !/^leftover/i.test(note)) return { label: note, value: { note: 'Leftover ' + note } };
    return null;
  }

  useEffect(() => { if (!flash) return; const t = setTimeout(() => setFlash(null), 4000); return () => clearTimeout(t); }, [flash]);
  function addShopping(items) {
    update('shopping', list => [...list, ...items]);
    setShowShop(false);
    setFlash(`Added ${items.length} item${items.length!==1?'s':''} to your shopping list`);
  }

  function PlanActions() {
    if (weekOffset < 0) return null;
    const showFill = emptyDinners.length > 0 && recipes.length > 1, showUndo = undo && undo.weekKey === weekKey;
    const showList = Object.values(cells).some(v => cellRecipeId(v) && recipeMap[v]);
    if (!showFill && !showUndo && !showList && !flash) return null;
    return (<div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginBottom:16}}>
      {showFill && <Btn secondary sm onClick={fillDinners}>✨ Fill {emptyDinners.length} empty dinner{emptyDinners.length>1?'s':''}</Btn>}
      {showList && <Btn secondary sm onClick={()=>setShowShop(true)}>🛒 Shopping list for this week</Btn>}
      {flash && <div style={{...S.badge,background:'var(--success-bg)',color:'var(--success)',padding:'6px 10px'}}>✓ {flash}</div>}
      {showUndo && <div style={{...S.badge,background:'var(--surface)',border:'1px solid var(--border)',color:'var(--text)',padding:'4px 4px 4px 10px',gap:8,fontWeight:500}}>
        Filled {Object.keys(undo.filled).length} — tap any to change
        <button style={{...chipBtn,fontSize:'.78rem'}} onClick={undoFill}>Undo</button></div>}
    </div>);
  }

  const filtered = recipes.filter(r => r.name?.toLowerCase().includes(search.toLowerCase()));
  const mealPrepFiltered = recipes.filter(r => r.name?.toLowerCase().includes(mealPrepSearch.toLowerCase()));
  const selectedDayCount = DAYS.filter(d => mealPrepDays[d]).length;

  // Shared meal prep section (used in both mobile and desktop)
  function MealPrepSection() {
    const mpRecipe = mealPrep ? recipeMap[mealPrep.recipeId] : null;
    return (
      <div style={{marginTop:20}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <div style={S.sectionTitle}>🥡 Meal Prep</div>
          {mealPrepHistory.length > 0 && (
            <button style={S.btnGhost} onClick={()=>setShowHistory(!showHistory)}>
              {showHistory ? 'Hide history' : 'History'}
            </button>
          )}
        </div>

        {mealPrep && mpRecipe ? (
          <div style={{...S.card,display:'flex',alignItems:'center',gap:12}}>
            <span style={{fontSize:'1.2rem'}}>{CAT_EMOJI[mpRecipe.category]||'📦'}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={S.itemName}>{mpRecipe.name}</div>
              <div style={S.itemMeta}>{mealPrep.days.join(', ')}</div>
            </div>
            <div style={{display:'flex',gap:4,flexShrink:0}}>
              <Btn secondary sm onClick={openMealPrep}>Change</Btn>
              <Btn danger sm onClick={clearMealPrep}>Clear</Btn>
            </div>
          </div>
        ) : (
          <div style={{...S.card,textAlign:'center',padding:'16px'}}>
            <div style={{color:'var(--text-muted)',fontSize:'.85rem',marginBottom:10}}>No meal prep set for this week</div>
            <Btn primary sm onClick={openMealPrep}>Set Meal Prep</Btn>
          </div>
        )}

        {showHistory && mealPrepHistory.length > 0 && (
          <div style={{marginTop:10}}>
            <div style={{fontSize:'.72rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--text-muted)',marginBottom:6}}>Last 12 weeks</div>
            {mealPrepHistory.map((h,i) => (
              <div key={i} style={{...S.itemRow,cursor:'pointer'}} onClick={()=>reuseMealPrep(h)}>
                <CatDot cat={h.category} />
                <div style={{flex:1,minWidth:0}}>
                  <div style={S.itemName}>{h.recipeName}</div>
                  <div style={S.itemMeta}>{relDate(h.weekKey)} · {h.days.join(', ')}</div>
                </div>
                <Btn secondary sm>Reuse</Btn>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // "Tonight" card: the next meal today that has a recipe
  function TodayCard() {
    if (weekOffset !== 0) return null;
    const di = (new Date().getDay() + 1) % 7, day = DAYS[di];
    const lunchId = cells[`${day}-Lunch`], dinnerId = cells[`${day}-Dinner`];
    const pick = (new Date().getHours() < 14 && typeof lunchId === 'string' && recipeMap[lunchId]) ? ['Lunch today', recipeMap[lunchId]]
      : (typeof dinnerId === 'string' && recipeMap[dinnerId]) ? ['Tonight', recipeMap[dinnerId]] : null;
    if (!pick) return null;
    const [label, r] = pick;
    return (<div style={{...S.card,display:'flex',alignItems:'center',gap:12,marginBottom:16,background:'var(--accent-bg)',borderColor:'transparent'}}>
      <span style={{fontSize:'1.6rem'}}>👩‍🍳</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:'.72rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--accent)'}}>{label}</div>
        <div style={{...S.itemName,fontSize:'1rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.name}</div>
      </div>
      <Btn primary sm onClick={()=>cook(r.id)}>Start cooking</Btn>
    </div>);
  }

  // Shared recipe picker overlay content (used in both mobile and desktop)
  function RecipePickerContent() {
    const isLunch = picker?.meal === 'Lunch';
    const current = cells[`${picker.day}-${picker.meal}`];
    const currentRecipe = typeof current === 'string' ? recipeMap[current] : null;
    const exactMatch = filtered.some(r => r.name?.trim().toLowerCase() === search.trim().toLowerCase());
    const sugg = search ? [] : suggestFor({ recipes, history, weekKey, day: picker.day, meal: picker.meal, cells });
    const leftover = isLunch && !search ? prevDinner(picker.day) : null;
    return (<div>
      {currentRecipe && <div style={{...S.card,display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
        <CatDot cat={currentRecipe.category} />
        <div style={{flex:1,minWidth:0,...S.itemName}}>{currentRecipe.name}</div>
        <Btn primary sm onClick={()=>{setPicker(null);setSearch('');cook(currentRecipe.id)}}>👩‍🍳 Cook</Btn>
      </div>}
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
        {current && <Btn danger sm onClick={()=>assign(null)}>Clear</Btn>}
        <Btn secondary sm onClick={()=>assign('__OUT__')}>🍽️ Eating out</Btn>
      </div>

      <div style={{position:'relative',marginBottom:14}}>
        <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--text-muted)',pointerEvents:'none'}}>{Icon.search}</span>
        <input style={{paddingLeft:36}} placeholder="Search recipes or type any meal…" value={search} onChange={e=>setSearch(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter' && search.trim() && !exactMatch) { e.preventDefault(); addNote(); } }} />
      </div>
      {search.trim() && !exactMatch && (
        <div style={{...S.itemRow,cursor:'pointer'}} onClick={addNote}>
          <span style={{width:8,display:'flex',justifyContent:'center',color:'var(--accent)',fontWeight:700}}>+</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={S.itemName}>Add “{search.trim()}”</div>
            <div style={S.itemMeta}>Without a recipe</div>
          </div>
        </div>
      )}

      {!search && <>
        {leftover && (
          <div style={{...S.itemRow,cursor:'pointer'}} onClick={()=>assign(leftover.value)}>
            <span style={{fontSize:'1.1rem'}}>🍱</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={S.itemName}>Leftovers: {leftover.label}</div>
              <div style={S.itemMeta}>From the night before</div>
            </div>
          </div>
        )}
        {sugg.length > 1 && (<div style={{marginBottom:6}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',margin:'14px 0 2px'}}>
            <div style={{...S.sectionTitle,margin:0}}>✨ Suggestions</div>
            <button style={{...chipBtn,fontSize:'.8rem',padding:'6px 12px'}} onClick={()=>surpriseMe(sugg)}>🎲 Surprise me</button>
          </div>
          {surprise && recipeMap[surprise.id] && (
            <div style={{...S.card,marginTop:10,background:'var(--accent-bg)',borderColor:'transparent',textAlign:'center',padding:'16px'}}>
              <div style={{fontSize:'.78rem',color:'var(--text-muted)'}}>How about…</div>
              <div style={{fontFamily:'Lora,Georgia,serif',fontWeight:600,fontSize:'1.2rem',margin:'4px 0'}}>{recipeMap[surprise.id].name}</div>
              {surprise.why && <div style={S.itemMeta}>{surprise.why}</div>}
              <div style={{display:'flex',gap:8,justifyContent:'center',marginTop:12}}>
                <Btn primary sm onClick={()=>assign(surprise.id)}>Yes, plan it</Btn>
                <Btn secondary sm onClick={()=>surpriseMe(sugg)}>Another</Btn>
              </div>
            </div>
          )}
          {sugg.slice(0,3).map(sg => (
            <div key={sg.recipe.id} style={{...S.itemRow,cursor:'pointer'}} onClick={()=>assign(sg.recipe.id)}>
              <CatDot cat={sg.recipe.category} />
              <div style={{flex:1,minWidth:0}}>
                <div style={S.itemName}>{sg.recipe.name}</div>
                {sg.why && <div style={S.itemMeta}>{sg.why}</div>}
              </div>
            </div>
          ))}
        </div>)}

        {isLunch && recentMealPrepRecipes.length > 0 && (
          <div>
            <div style={S.sectionTitle}>🥡 Recent meal preps</div>
            {recentMealPrepRecipes.map(h => (
              <div key={h.recipeId} style={{...S.itemRow,cursor:'pointer',padding:'8px 0'}} onClick={()=>assign(h.recipeId)}>
                <CatDot cat={h.category} />
                <div style={{flex:1,minWidth:0}}><div style={S.itemName}>{h.recipeName}</div></div>
              </div>
            ))}
          </div>
        )}
        {recipes.length > 0 && <div style={S.sectionTitle}>All recipes</div>}
      </>}

      {filtered.length===0 ? (!search.trim() && <p style={{color:'var(--text-muted)',textAlign:'center',padding:20}}>No recipes yet. Type a meal above, or add recipes in the Recipes tab.</p>)
      : [...filtered].sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(r => (
        <div key={r.id} style={{...S.itemRow,cursor:'pointer'}} onClick={()=>assign(r.id)}>
          <CatDot cat={r.category} />
          <div style={{flex:1,minWidth:0}}>
            <div style={S.itemName}>{r.name}</div>
            {(r.rating>0 || r.lastPlanned) && <div style={S.itemMeta}>{r.rating>0 && <span style={{color:'#E0A030'}}>{'★'.repeat(r.rating)}</span>}{r.rating>0 && r.lastPlanned && ' · '}{r.lastPlanned && <>Last planned {relDate(r.lastPlanned)}</>}</div>}
          </div>
        </div>
      ))}
    </div>);
  }

  // Meal prep overlay content
  function MealPrepOverlayContent() {
    if (mealPrepOverlay === 'pick') {
      return (<div>
        <p style={{fontSize:'.85rem',color:'var(--text-muted)',marginBottom:14}}>Pick a recipe to meal prep this week.</p>

        {recentMealPrepRecipes.length > 0 && !mealPrepSearch && (
          <div style={{marginBottom:14}}>
            <div style={{fontSize:'.72rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--text-muted)',marginBottom:6}}>Recent meal preps</div>
            {recentMealPrepRecipes.map(h => (
              <div key={h.recipeId} style={{...S.itemRow,cursor:'pointer'}} onClick={()=>pickMealPrepRecipe(h.recipeId)}>
                <CatDot cat={h.category} />
                <div style={{flex:1,minWidth:0}}>
                  <div style={S.itemName}>{h.recipeName}</div>
                </div>
              </div>
            ))}
            <div style={{borderBottom:'1px solid var(--border)',margin:'6px 0'}} />
          </div>
        )}

        <div style={{position:'relative',marginBottom:14}}>
          <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--text-muted)',pointerEvents:'none'}}>{Icon.search}</span>
          <input style={{paddingLeft:36}} placeholder="Search recipes…" value={mealPrepSearch} onChange={e=>setMealPrepSearch(e.target.value)} />
        </div>
        {mealPrepFiltered.map(r => (
          <div key={r.id} style={{...S.itemRow,cursor:'pointer'}} onClick={()=>pickMealPrepRecipe(r.id)}>
            <CatDot cat={r.category} />

            <React.Fragment key={meal}>
              <div style={S.planMealLabel}>{meal}</div>
              {DAYS.map(day => {
                const key = `${day}-${meal}`;
                const val = cells[key];
                const isOut = val === '__OUT__';
                const lo = cellLeftover(val);
                const note = cellNote(val) || (lo ? '🍱 ' + (recipeMap[lo]?.name || 'Leftovers') : null);

                    {isOut ? <span style={{fontSize:'.82rem'}}>🍽️ Out</span>
                      : note ? <span style={{fontSize:'.82rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'100%',display:'block'}}>{note}</span>
                      : recipe ? <span style={{fontSize:'.82rem',fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'100%',display:'block'}}>{recipe.name}</span>
                      : <span style={{color:'var(--text-muted)',fontSize:'.75rem'}}>+</span>}

        </div>

        {MealPrepSection()}

        <Overlay open={!!picker} onClose={()=>{setPicker(null);setSearch('')}} title={picker?`${picker.day} ${picker.meal}`:''}>
          {picker && RecipePickerContent()}

          {showShop && <ShopFromPlan plan={plan} recipeMap={recipeMap} inventory={data.inventory} shopping={data.shopping} todayIdx={todayIdx} onAdd={addShopping} />}
        </Overlay>
        <Overlay open={!!mealPrepOverlay} onClose={()=>{setMealPrepOverlay(null);setMealPrepSearch('')}} title={mealPrepOverlay==='days'?'Pick Days':'Set Meal Prep'}>
          {MealPrepOverlayContent()}
        </Overlay>
      </div>
    );
  }

  // Mobile stacked view
  return (
    <div>
      <div style={S.pageHead}><h1 style={{fontSize:'1.5rem',letterSpacing:'-.02em'}}>Meal Plan</h1></div>
      <div style={S.weekNav}>
        <button style={S.weekBtn} onClick={()=>setWeekOffset(w=>w-1)}>{Icon.chevL}</button>
        <span style={{fontFamily:'Lora,Georgia,serif',fontWeight:600,fontSize:'.95rem'}}>{isThisWeek(weekStart)?'This Week':fmtWeek(weekStart)}</span>
        <button style={S.weekBtn} onClick={()=>setWeekOffset(w=>w+1)}>{Icon.chevR}</button>
      </div>
      {TodayCard()}
      {PlanActions()}

      {DAYS.map((day,di) => (
        <div key={day} style={{marginBottom:12}}>
          <div style={S.dayName}>{DAY_FULL[di]}</div>
          <div style={{display:'flex',gap:8}}>
            {MEALS.map(meal => {
              const key = `${day}-${meal}`;
              const val = cells[key];
              const isOut = val === '__OUT__';
              const lo = cellLeftover(val);
              const note = cellNote(val) || (lo ? '🍱 ' + (recipeMap[lo]?.name || 'Leftovers') : null);
              const recipe = cellRecipeId(val) ? recipeMap[val] : null;
              return (
                <div key={meal} style={S.mealCell} onClick={()=>openPicker(day,meal)}>
                  <div style={{fontSize:'.68rem',fontWeight:600,textTransform:'uppercase',letterSpacing:'.05em',color:'var(--text-muted)',marginBottom:3}}>{meal}</div>
                  {isOut ? <div style={{fontSize:'.85rem',fontWeight:500}}>🍽️ Out</div>
                    : note ? <div style={{fontSize:'.85rem',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{note}</div>
                    : recipe ? <div style={{fontSize:'.85rem',fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{recipe.name}</div>
                    : <div style={{color:'var(--text-muted)',fontStyle:'italic',fontSize:'.8rem'}}>+ Add</div>}
                </div>
              );
            })}
          </div>
        </div>
      ))}

      {MealPrepSection()}

      <Overlay open={!!picker} onClose={()=>{setPicker(null);setSearch('')}} title={picker?`${picker.day} ${picker.meal}`:''}>
        {picker && RecipePickerContent()}
      </Overlay>
      <Overlay open={showShop} onClose={()=>setShowShop(false)} title="Shopping for this week">
          {showShop && <ShopFromPlan plan={plan} recipeMap={recipeMap} inventory={data.inventory} shopping={data.shopping} todayIdx={todayIdx} onAdd={addShopping} />}
        </Overlay>
        <Overlay open={!!mealPrepOverlay} onClose={()=>{setMealPrepOverlay(null);setMealPrepSearch('')}} title={mealPrepOverlay==='days'?'Pick Days':'Set Meal Prep'}>
        {MealPrepOverlayContent()}
      </Overlay>
    </div>
  );
}

// ======================== RECIPE IMPORT ========================
// Turns schema.org Recipe data (from the import-recipe Supabase function) into this app's recipe shape.
function plainText(s) {
  if (s == null) return '';
  try { return (new DOMParser().parseFromString(String(s), 'text/html').body.textContent || '').replace(/\s+/g, ' ').trim(); }
  catch(e) { return String(s).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
}
function isoDuration(s) {
  const m = /^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?)?$/i.exec(String(s || '').trim());
  if (!m) return plainText(s);
  const mins = (+m[1]||0)*1440 + (+m[2]||0)*60 + (+m[3]||0) + Math.round((+m[4]||0)/60);
  if (!mins) return '';
  const h = Math.floor(mins/60), mm = mins % 60;
  return [h && `${h} hr${h>1?'s':''}`, mm && `${mm} min${mm>1?'s':''}`].filter(Boolean).join(' ');
}
const ING_UNIT = '(?:g|kg|mg|ml|l|oz|lb|lbs|pounds?|ounces?|grams?|kilograms?|litres?|liters?|pints?|tsp|tbsp|tbs|teaspoons?|tablespoons?|cups?|cloves?|tins?|cans?|packs?|packets?|bunch(?:es)?|handfuls?|pinch(?:es)?|slices?|jars?|sprigs?|sticks?|heads?|fillets?|rashers?|knobs?|sachets?|bags?)';
const ING_NUM = '(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d*\\.?\\d+\\s*[½¼¾⅓⅔]?|[½¼¾⅓⅔])';
const ING_RE = new RegExp(`^(${ING_NUM}(?:\\s*(?:-|–|to)\\s*${ING_NUM})?(?:\\s*x\\s*${ING_NUM})?(?:\\s*${ING_UNIT}\\b\\.?){0,2}(?:\\s*\\/\\s*${ING_NUM}\\s*(?:fl\\s*)?(?:oz|lb|ml|g)\\b)?)\\s+(?:of\\s+)?(.+)$`, 'i');
function splitIngredient(line) {
  const t = plainText(line);
  const m = ING_RE.exec(t);
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
  return m ? { qty: m[1].replace(/\s+/g, ' ').trim(), name: cap(m[2].trim()) } : { qty: '', name: cap(t) };
}
function flattenSteps(ins) {
  if (!ins) return [];
  if (typeof ins === 'string') {
    const t = ins.replace(/<\/(p|li)>|<br\s*\/?>/gi, '\n');
    return t.split(/\n+/).map(plainText).filter(Boolean);
  }
  if (Array.isArray(ins)) return ins.flatMap(flattenSteps);
  if (typeof ins === 'object') {
    if (ins.itemListElement) return flattenSteps(ins.itemListElement);
    return flattenSteps(ins.text || ins.name || '');
  }
  return [];
}
function firstImage(img) {
  if (!img) return '';
  if (typeof img === 'string') return img;
  if (Array.isArray(img)) return firstImage(img[0]);
  return img.url || img.contentUrl || '';
}
function normalizeImported(r, url) {
  const name = plainText(r.name) || 'Imported recipe';
  const yields = [].concat(r.recipeYield || []).map(String);
  const servings = (yields.map(y => (y.match(/\d+/) || [])[0]).find(Boolean)) || '';
  let prep = isoDuration(r.prepTime), cook = isoDuration(r.cookTime);
  if (!prep && !cook && r.totalTime) cook = isoDuration(r.totalTime);
  const ingredients = [].concat(r.recipeIngredient || []).map(splitIngredient).filter(i => i.name);
  const method = flattenSteps(r.recipeInstructions);
  const guess = guessCategory(name);
  return {
    name, servings, prepTime: prep, cookTime: cook,
    category: guess !== 'Other' ? guess : 'Other',
    ingredients: ingredients.length ? ingredients : [{ name:'', qty:'' }],
    method: method.length ? method : [''],
    source: url, image: firstImage(r.image),
  };
}

// ======================== RECIPES TAB ========================
function RecipesTab({data, update, isDesktop, cook, sharedUrl, clearShared}) {
  const {recipes} = data;
  const [search, setSearch] = useState('');
  const [view, setView] = useState(null);
  const [form, setForm] = useState(null);
  const [imp, setImp] = useState(null); // {url, busy, error, existingId}

  async function runImport(rawUrl) {
    const url = (rawUrl || '').trim();
    if (!/^https?:\/\//i.test(url)) { setImp(i => ({...i, url, busy:false, error:'Paste a full link starting with http:// or https://'})); return; }
    const existing = recipes.find(r => r.source && r.source.replace(/[#?].*$/,'') === url.replace(/[#?].*$/,''));
    if (existing) { setImp(i => ({...i, url, busy:false, error:`You already have this one: ${existing.name}`, existingId: existing.id})); return; }
    setImp(i => ({...i, url, busy:true, error:null, existingId:null}));
    try {
      const { data:res, error } = await sb.functions.invoke('import-recipe', { body: { url } });
      if (error) {
        const status = error.context?.status;
        let msg = !navigator.onLine ? "You're offline. Try again when you're connected."
          : (status === 404 || error.name === 'FunctionsFetchError' || error.name === 'FunctionsRelayError')
            ? "Link import isn't set up yet: the import-recipe function needs deploying to Supabase."
            : status === 401 ? 'Please log out and back in, then try again.' : "Couldn't import that link. Try again in a moment.";
        try { const b = await error.context?.json?.(); if (b?.error && status !== 404) msg = b.error; } catch(e) {}
        setImp(i => ({...i, busy:false, error: msg})); return;
      }
      if (!res?.recipe) { setImp(i => ({...i, busy:false, error: res?.error || "Couldn't find a recipe on that page."})); return; }
      setForm(normalizeImported(res.recipe, res.url || url));
      setImp(null); setView('add');
    } catch(e) { setImp(i => ({...i, busy:false, error:"Couldn't import that link. Try again in a moment."})); }
  }
  useEffect(() => { if (sharedUrl) { setView(null); setImp({ url: sharedUrl }); runImport(sharedUrl); clearShared(); } }, [sharedUrl]);

  function openAdd() {
    setForm({name:'',servings:'4',prepTime:'',cookTime:'',category:'Other',ingredients:[{name:'',qty:''}],method:['']});
    setView('add');
  }
  function openEdit(r) {
    setForm({...r,ingredients:r.ingredients?.length?[...r.ingredients.map(i=>({...i}))]:[{name:'',qty:''}],method:r.method?.length?[...r.method]:['']});
    setView('edit');
  }

  function saveRecipe() {
    if(!form?.name?.trim()) return;
    const rec = {
      name:form.name.trim(), servings:form.servings||'4', prepTime:form.prepTime||'', cookTime:form.cookTime||'',
      category:form.category||'Other',
      ...(form.source ? {source:form.source} : {}), ...(form.image ? {image:form.image} : {}),
      ingredients:form.ingredients.filter(i=>i.name.trim()).map(i=>({name:i.name.trim(),qty:i.qty.trim()})),
      method:form.method.filter(s=>s.trim()),
    };
    if(form.id) {
      update('recipes', rs => rs.map(r => r.id===form.id ? {...r,...rec} : r));
    } else {
      rec.id = genId(); rec.createdAt = new Date().toISOString();
      update('recipes', rs => [...rs, rec]);
    }
    setView(null); setForm(null);
  }

  function deleteRecipe(id) {
    if(!confirm('Delete this recipe?')) return;
    update('recipes', rs => rs.filter(r => r.id!==id));
    setView(null);
  }
  function setRecipeField(id, k, v) { update('recipes', rs => rs.map(r => r.id===id ? {...r, [k]:v} : r)); }

  function addToList(recipe) {
    if(!recipe.ingredients) return;
    update('shopping', list => {
      const items = recipe.ingredients.filter(i=>i.name.trim()).map(i => ({
        id:genId(), name:i.name.trim(), qty:i.qty||'', category:guessCategory(i.name),
        checked:false, fromRecipe:recipe.name, addedAt:new Date().toISOString()
      }));
      return [...list, ...items];
    });
    setView(null);
  }

  const filtered = recipes.filter(r => r.name?.toLowerCase().includes(search.toLowerCase()));
  // view: null | 'add' | 'edit' | recipe id (looked up so the detail shows live data)
  const viewRecipe = typeof view==='string' && view!=='add' && view!=='edit' ? recipes.find(r=>r.id===view) : null;

  function RecipeForm() {
    const f = form;
    const set = (k,v) => setForm(p=>({...p,[k]:v}));
    const updateIng = (i,k,v) => { const a=[...f.ingredients]; a[i]={...a[i],[k]:v}; set('ingredients',a); };
    const addIng = () => set('ingredients',[...f.ingredients,{name:'',qty:''}]);
    const rmIng = i => set('ingredients',f.ingredients.filter((_,idx)=>idx!==i));
    const updateStep = (i,v) => { const a=[...f.method]; a[i]=v; set('method',a); };
    const addStep = () => set('method',[...f.method,'']);
    const rmStep = i => set('method',f.method.filter((_,idx)=>idx!==i));
    return (<div>
      {f.source && !f.id && <div style={{background:'var(--success-bg)',borderRadius:10,padding:'10px 12px',fontSize:'.85rem',marginBottom:14}}>
        Imported from <strong>{(()=>{try{return new URL(f.source).hostname.replace(/^www\./,'')}catch(e){return 'the web'}})()}</strong>. Check it over, then save.</div>}
      <div style={S.field}><label style={S.label}>Name</label><input value={f.name} onChange={e=>set('name',e.target.value)} placeholder="Recipe name" /></div>
      <div style={S.fieldRow}>
        <div style={{...S.field,flex:1}}><label style={S.label}>Servings</label><input value={f.servings} onChange={e=>set('servings',e.target.value)} placeholder="4" /></div>
        <div style={{...S.field,flex:1}}><label style={S.label}>Category</label>
          <select value={f.category} onChange={e=>set('category',e.target.value)}>
            {CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>
      <div style={S.fieldRow}>
        <div style={{...S.field,flex:1}}><label style={S.label}>Prep Time</label><input value={f.prepTime} onChange={e=>set('prepTime',e.target.value)} placeholder="15 mins" /></div>
        <div style={{...S.field,flex:1}}><label style={S.label}>Cook Time</label><input value={f.cookTime} onChange={e=>set('cookTime',e.target.value)} placeholder="30 mins" /></div>
      </div>
      <div style={S.sectionTitle}>Ingredients</div>
      {f.ingredients.map((ing,i) => (
        <div key={i} style={S.ingRow}>
          <input style={{flex:2}} placeholder="Ingredient" value={ing.name} onChange={e=>updateIng(i,'name',e.target.value)} />
          <input style={{flex:1}} placeholder="Qty" value={ing.qty} onChange={e=>updateIng(i,'qty',e.target.value)} />
          {f.ingredients.length>1 && <button style={S.removeBtn} onClick={()=>rmIng(i)}>&times;</button>}
        </div>
      ))}
      <button style={S.btnGhost} onClick={addIng}>+ Add ingredient</button>
      <div style={S.sectionTitle}>Method</div>
      {f.method.map((step,i) => (
        <div key={i} style={S.ingRow}>
          <input style={{flex:1}} placeholder={`Step ${i+1}`} value={step} onChange={e=>updateStep(i,e.target.value)} />
          {f.method.length>1 && <button style={S.removeBtn} onClick={()=>rmStep(i)}>&times;</button>}
        </div>
      ))}
      <button style={S.btnGhost} onClick={addStep}>+ Add step</button>
      <div style={{display:'flex',gap:8,marginTop:20}}>
        <Btn primary onClick={saveRecipe} disabled={!f.name.trim()}>Save Recipe</Btn>
      </div>
    </div>);
  }

  function RecipeDetail({recipe}) {
    return (<div>
      {recipe.image && <img src={recipe.image} alt="" referrerPolicy="no-referrer" onError={e=>{e.currentTarget.style.display='none'}}
        style={{width:'100%',maxHeight:220,objectFit:'cover',borderRadius:12,marginBottom:14,display:'block',background:'var(--border)'}} />}
      <Btn primary style={{width:'100%',padding:'14px',fontSize:'1rem',marginBottom:16}} onClick={()=>{setView(null);cook(recipe.id)}}>👩‍🍳 Start cooking</Btn>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}>
        <CatDot cat={recipe.category} />
        <span style={{...S.badge,background:'var(--border)',color:'var(--text-muted)'}}>{recipe.category}</span>
        <span style={{marginLeft:'auto'}}><Stars value={recipe.rating||0} onChange={v=>setRecipeField(recipe.id,'rating',v)} /></span>
      </div>
      {recipe.lastCooked && <div style={S.itemMeta}>Last cooked {relDate(recipe.lastCooked)}{recipe.cookLog?.length>1 && <> · cooked {recipe.cookLog.length} times</>}</div>}
      <div style={{...S.field,marginTop:12,marginBottom:0}}>
        <label style={S.label}>Notes for next time</label>
        <textarea style={{minHeight:56}} defaultValue={recipe.notes||''} key={recipe.id+':'+(recipe.notes||'')} placeholder="e.g. Less chilli, double the sauce"
          onBlur={e=>{ const v=e.target.value.trim(); if(v!==(recipe.notes||'')) setRecipeField(recipe.id,'notes',v); }} />
      </div>
      <div style={{display:'flex',gap:16,flexWrap:'wrap',margin:'12px 0'}}>
        {recipe.servings && <span style={{fontSize:'.82rem',color:'var(--text-muted)'}}><strong style={{color:'var(--text)',fontWeight:600}}>{recipe.servings}</strong> servings</span>}
        {recipe.prepTime && <span style={{fontSize:'.82rem',color:'var(--text-muted)'}}><strong style={{color:'var(--text)',fontWeight:600}}>{recipe.prepTime}</strong> prep</span>}
        {recipe.cookTime && <span style={{fontSize:'.82rem',color:'var(--text-muted)'}}><strong style={{color:'var(--text)',fontWeight:600}}>{recipe.cookTime}</strong> cook</span>}
      </div>
      {recipe.ingredients?.length>0 && (<>
        <div style={S.sectionTitle}>Ingredients</div>
        {recipe.ingredients.map((ing,i) => (
          <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border)',fontSize:'.88rem'}}>
            <span>{ing.name}</span><span style={{color:'var(--text-muted)',fontVariantNumeric:'tabular-nums'}}>{ing.qty}</span>
          </div>
        ))}
      </>)}
      {recipe.method?.length>0 && (<>
        <div style={S.sectionTitle}>Method</div>
        {recipe.method.map((step,i) => (
          <div key={i} style={{display:'flex',gap:10,padding:'8px 0',borderBottom:'1px solid var(--border)',fontSize:'.88rem',lineHeight:1.5}}>
            <span style={{width:22,height:22,borderRadius:'50%',background:'var(--accent-bg)',color:'var(--accent)',fontSize:'.72rem',fontWeight:700,
              display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{i+1}</span>
            <span>{step}</span>
          </div>
        ))}
      </>)}
      <div style={{display:'flex',gap:8,marginTop:18,flexWrap:'wrap'}}>
        <Btn primary sm onClick={()=>addToList(recipe)}>Add to List</Btn>
        {recipe.source && <a href={recipe.source} target="_blank" rel="noopener noreferrer" style={{...S.btn,...S.btnSecondary,...S.btnSm,textDecoration:'none'}}>Original ↗</a>}
        <Btn secondary sm onClick={()=>openEdit(recipe)}>Edit</Btn>
        <Btn danger sm onClick={()=>deleteRecipe(recipe.id)}>Delete</Btn>
      </div>
    </div>);
  }

  return (<div>
    <div style={S.pageHead}>
      <h1 style={{fontSize:'1.5rem',letterSpacing:'-.02em',flex:1}}>Recipes</h1>
      <div style={{display:'flex',gap:6}}>
        <Btn secondary sm onClick={()=>setImp({url:''})}>🔗 Import</Btn>
        <Btn primary sm onClick={openAdd}>+ Add</Btn>
      </div>
    </div>
    {recipes.length>0 && (
      <div style={{position:'relative',marginBottom:14}}>
        <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--text-muted)',pointerEvents:'none'}}>{Icon.search}</span>
        <input style={{paddingLeft:36}} placeholder="Search recipes…" value={search} onChange={e=>setSearch(e.target.value)} />
      </div>
    )}
    {filtered.length===0 && !search ? (
      <EmptyState icon="📖" title="No recipes yet" msg="Start building your collection." action="+ Add Recipe" onAction={openAdd} />
    ) : filtered.length===0 ? (

    ) : (
      <div style={isDesktop ? S.cardGrid : {}}>
        {filtered.map(r => (
          <div key={r.id} style={{...S.card,cursor:'pointer'}} onClick={()=>setView(r.id)}>

              <div style={{flex:1,minWidth:0}}>
                <div style={S.itemName}>{r.name}</div>
                <div style={S.itemMeta}>{r.rating>0 && <span style={{color:'#E0A030'}}>{'★'.repeat(r.rating)} · </span>}{r.ingredients?.length||0} ingredients{r.lastPlanned && <> · Last planned {relDate(r.lastPlanned)}</>}</div>
              </div>
            </div>
          </div>
        ))}
      </div>
    )}
    <Overlay open={!!imp} onClose={()=>setImp(null)} title="Import from a link">
      {imp && <form onSubmit={e=>{e.preventDefault(); runImport(imp.url);}}>
        <p style={{fontSize:'.85rem',color:'var(--text-muted)',marginBottom:12}}>Paste a link to a recipe page (BBC Good Food, a food blog…). You'll get to check it before saving.</p>
        <div style={S.field}><input type="url" inputMode="url" autoFocus placeholder="https://…" value={imp.url} disabled={imp.busy}
          onChange={e=>{ const url = e.target.value; setImp(i=>({...i, url, error:null, existingId:null})); }} /></div>
        {imp.error && <div style={{background:'var(--danger-bg)',color:'var(--danger)',borderRadius:10,padding:'10px 14px',fontSize:'.85rem',marginBottom:14}}>
          {imp.error}{imp.existingId && <> · <button type="button" style={{...S.btnGhost,padding:0,color:'inherit',textDecoration:'underline'}} onClick={()=>{const id=imp.existingId;setImp(null);setView(id);}}>Open it</button></>}
        </div>}
        <Btn primary type="submit" style={{width:'100%'}} disabled={imp.busy || !imp.url.trim()}>{imp.busy ? 'Fetching recipe…' : 'Import'}</Btn>
      </form>}
    </Overlay>
    <Overlay open={view==='add'||view==='edit'} onClose={()=>{setView(null);setForm(null)}} title={view==='edit'?'Edit Recipe':'Add Recipe'}>
      {form && RecipeForm()}
    </Overlay>
    <Overlay open={!!viewRecipe} onClose={()=>setView(null)} title={viewRecipe?.name||''}>
      {viewRecipe && RecipeDetail({recipe:viewRecipe})}
    </Overlay>
  </div>);
}

// ======================== PANTRY TAB ========================
function PantryTab({data, update, isDesktop}) {
  const {inventory} = data;
  const [showAdd, setShowAdd] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [newName, setNewName] = useState('');
  const [newCat, setNewCat] = useState('Other');
  const [receiptText, setReceiptText] = useState('');
  const [parsedItems, setParsedItems] = useState([]);
  const [importDate, setImportDate] = useState(fmtDate(new Date()));
  const [importStep, setImportStep] = useState('paste'); // 'paste' | 'review'

  const sorted = useMemo(() => {
    return [...inventory].map(i=>({...i,restock:calcRestock(i.purchases)}))
      .sort((a,b) => {
        if(a.restock?.isOverdue && !b.restock?.isOverdue) return -1;
        if(!a.restock?.isOverdue && b.restock?.isOverdue) return 1;
        return (a.name||'').localeCompare(b.name||'');
      });
  }, [inventory]);

  const overdueCount = sorted.filter(i=>i.restock?.isOverdue).length;

  function addItem() {
    if(!newName.trim()) return;
    const today = fmtDate(new Date());
    const existing = inventory.find(i=>i.name.toLowerCase()===newName.trim().toLowerCase());
    if(existing) {
      update('inventory', inv => inv.map(i=>i.id===existing.id?{...i,purchases:[...(i.purchases||[]),today]}:i));
    } else {
      update('inventory', inv => [...inv, {id:genId(),name:newName.trim(),category:newCat,purchases:[today],createdAt:new Date().toISOString()}]);
    }
    setNewName(''); setNewCat('Other'); setShowAdd(false);
  }

  function markBought(item) {
    const today = fmtDate(new Date());
    update('inventory', inv => inv.map(i=>i.id===item.id?{...i,purchases:[...(i.purchases||[]),today]}:i));
  }

  function removeItem(id) {
    update('inventory', inv => inv.filter(i=>i.id!==id));
  }

  // Receipt import
  function handleParse() {
    const items = parseReceipt(receiptText);
    setParsedItems(items);
    setImportStep('review');
  }

  function toggleParsedItem(idx) {
    setParsedItems(prev => prev.map((item,i) => i===idx ? {...item, selected:!item.selected} : item));
  }

  function updateParsedCategory(idx, cat) {
    setParsedItems(prev => prev.map((item,i) => i===idx ? {...item, category:cat} : item));
  }

  function confirmImport() {
    const selected = parsedItems.filter(i => i.selected);
    if (selected.length === 0) return;
    update('inventory', inv => {
      let updated = [...inv];
      for (const item of selected) {
        const existing = updated.find(i => i.name.toLowerCase() === item.name.toLowerCase());
        if (existing) {
          updated = updated.map(i => i.id===existing.id ? {...i, purchases:[...(i.purchases||[]),importDate]} : i);
        } else {
          updated.push({id:genId(), name:item.name, category:item.category, purchases:[importDate], createdAt:new Date().toISOString()});
        }
      }
      return updated;
    });
    // Reset and close
    setShowImport(false); setReceiptText(''); setParsedItems([]); setImportStep('paste');
  }

  function closeImport() {
    setShowImport(false); setReceiptText(''); setParsedItems([]); setImportStep('paste');
  }

  const selectedCount = parsedItems.filter(i=>i.selected).length;

  return (<div>
    <div style={S.pageHead}>
      <h1 style={{fontSize:'1.5rem',letterSpacing:'-.02em',flex:1}}>Pantry</h1>
      <div style={{display:'flex',gap:6}}>
        <Btn secondary sm onClick={()=>setShowImport(true)} style={{gap:4}}>
          {Icon.receipt} Import
        </Btn>
        <Btn primary sm onClick={()=>setShowAdd(true)}>+ Add</Btn>
      </div>
    </div>

    {overdueCount>0 && (
      <div style={{background:'var(--warning-bg)',borderRadius:10,padding:'10px 14px',marginBottom:14,fontSize:'.85rem',color:'var(--warning)',fontWeight:500}}>
        {overdueCount} item{overdueCount>1?'s':''} may need restocking
      </div>
    )}

    {inventory.length===0 ? (
      <EmptyState icon="📦" title="Pantry is empty" msg="Add items when you buy them to track restock patterns, or import a receipt." action="+ Add Item" onAction={()=>setShowAdd(true)} />
    ) : (
      <div style={isDesktop ? S.cardGrid : {}}>
        {sorted.map(item => {
          const r = item.restock;
          const lastDate = item.purchases?.length ? [...item.purchases].sort().pop() : null;
          return (
            <div key={item.id} style={isDesktop ? {...S.card,marginBottom:0} : S.itemRow}>
              <div style={{display:'flex',alignItems:'center',gap:12,width:'100%'}}>
                <span style={{fontSize:'1.1rem'}}>{CAT_EMOJI[item.category]||'📦'}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={S.itemName}>{item.name}</span>
                    {r?.isOverdue && <span style={{...S.badge,background:'var(--warning-bg)',color:'var(--warning)'}}>Overdue {r.overdue}d</span>}
                  </div>
                  <div style={S.itemMeta}>
                    {lastDate && <>Last bought {relDate(lastDate)}</>}
                    {r && <> · Every ~{r.avgDays} days</>}
                    {!r && item.purchases?.length===1 && <> · Buy again to track frequency</>}
                  </div>
                </div>
                <div style={{display:'flex',gap:4,flexShrink:0}}>
                  <Btn secondary sm onClick={()=>markBought(item)}>Bought</Btn>
                  <button style={{...S.removeBtn,width:28,height:28}} onClick={()=>removeItem(item.id)}>&times;</button>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    )}

    {/* Add single item overlay */}
    <Overlay open={showAdd} onClose={()=>setShowAdd(false)} title="Add to Pantry">
      <div style={S.field}><label style={S.label}>Item name</label><input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="e.g. Whole milk" autoFocus /></div>
      <div style={S.field}><label style={S.label}>Category</label>
        <select value={newCat} onChange={e=>setNewCat(e.target.value)}>
          {CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <p style={{fontSize:'.82rem',color:'var(--text-muted)',marginBottom:14}}>Adds the item with today as the purchase date.</p>
      <Btn primary onClick={addItem} disabled={!newName.trim()}>Add Item</Btn>
    </Overlay>

    {/* Receipt import overlay */}
    <Overlay open={showImport} onClose={closeImport} title={importStep==='paste' ? 'Import Receipt' : `Review Items (${selectedCount} selected)`} wide>
      {importStep === 'paste' ? (
        <div>
          <p style={{fontSize:'.85rem',color:'var(--text-muted)',marginBottom:14,lineHeight:1.5}}>
            Paste your order confirmation text from Sainsbury's, Ocado or similar. The parser will extract item names and auto-categorise them.
          </p>
          <div style={S.field}>
            <label style={S.label}>Purchase date</label>
            <input type="date" value={importDate} onChange={e=>setImportDate(e.target.value)} />
          </div>
          <div style={S.field}>
            <label style={S.label}>Receipt text</label>
            <textarea
              value={receiptText}
              onChange={e=>setReceiptText(e.target.value)}
              placeholder={"Paste your order receipt here…\n\ne.g.\nSemi Skimmed Milk 2.27l £1.35\nFree Range Eggs x6 £1.75\nChicken Breast Fillets 300g £3.50"}
              style={{minHeight:200,fontFamily:'monospace',fontSize:'.82rem'}}
            />
          </div>
          <Btn primary onClick={handleParse} disabled={!receiptText.trim()}>Parse Receipt</Btn>
        </div>
      ) : (
        <div>
          <p style={{fontSize:'.85rem',color:'var(--text-muted)',marginBottom:14,lineHeight:1.5}}>
            {parsedItems.length === 0
              ? "Couldn't find any items in that text. Try pasting just the product lines with prices."
              : `Found ${parsedItems.length} item${parsedItems.length>1?'s':''}. Deselect any you don't want, and fix categories if needed.`}
          </p>

          {parsedItems.length > 0 && (
            <>
              <div style={{marginBottom:10,display:'flex',gap:8}}>
                <button style={S.btnGhost} onClick={()=>setParsedItems(p=>p.map(i=>({...i,selected:true})))}>Select all</button>
                <button style={S.btnGhost} onClick={()=>setParsedItems(p=>p.map(i=>({...i,selected:false})))}>Deselect all</button>
              </div>

              <div style={{maxHeight:400,overflowY:'auto',marginBottom:16}}>
                {parsedItems.map((item, idx) => (
                  <div key={idx} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:'1px solid var(--border)',opacity:item.selected?1:0.4}}>
                    <button style={{...S.checkbox,...(item.selected&&S.checkboxOn)}} onClick={()=>toggleParsedItem(idx)}>
                      {item.selected && Icon.check}
                    </button>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:'.88rem',fontWeight:500}}>{item.name}</div>
                    </div>
                    <select
                      value={item.category}
                      onChange={e=>updateParsedCategory(idx, e.target.value)}
                      style={{width:'auto',padding:'4px 8px',fontSize:'.78rem',minWidth:100}}
                    >
                      {CATEGORIES.map(c=><option key={c} value={c}>{CAT_EMOJI[c]} {c}</option>)}
                    </select>
                  </div>
                ))}
              </div>

              <div style={{display:'flex',gap:8}}>
                <Btn primary onClick={confirmImport} disabled={selectedCount===0}>
                  Import {selectedCount} item{selectedCount!==1?'s':''}
                </Btn>
                <Btn secondary onClick={()=>{setImportStep('paste')}}>Back</Btn>
              </div>
            </>
          )}

          {parsedItems.length === 0 && (
            <Btn secondary onClick={()=>setImportStep('paste')}>Back</Btn>
          )}
        </div>
      )}
    </Overlay>
  </div>);
}

function ShoppingTab({data, update, isDesktop}) {

  const [newQty, setNewQty] = useState('');

  const grouped = useMemo(() => {
    const unchecked = shopping.filter(i=>!i.checked);
    const checked = shopping.filter(i=>i.checked);
    const groups = {};
    unchecked.forEach(i => { const c=i.category||'Other'; if(!groups[c]) groups[c]=[]; groups[c].push(i); });
    return {groups, checked};
  }, [shopping]);

  function addItem(e) {
    e?.preventDefault?.();
    if(!newName.trim()) return;
    update('shopping', list => [...list, {id:genId(),name:newName.trim(),qty:newQty.trim()||'1',category:'Other',checked:false,addedAt:new Date().toISOString()}]);

    update('shopping', list => list.map(i=>i.id===item.id?{...i,checked:!i.checked}:i));
